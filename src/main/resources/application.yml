  servlet:
    multipart:
      max-file-size: 10MB
  # Redis配置 connect-timeout的单位默认是ms
  data:
    redis:
      password: 123456
      port: 6379
      host: 127.0.0.1
      connect-timeout: 5000
server:
  port: 8123
  servlet:
    context-path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    #仅在开发环境使用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 1删除  0未删除
      logic-delete-field: isDeleted
    enable-sql-runner: true

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
      paths-to-match: '/**'
      packages-to-scan: com.lc.yunpicturebackend.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn